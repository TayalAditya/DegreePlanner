<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101826">
  <title>Offline · Degree Planner</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #101826;
      --surface: #172133;
      --border: #2b3c56;
      --text: #eef3fb;
      --muted: #a9b9ce;
      --accent: #6da4ff;
      --success: #68cf9a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 31rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      padding: clamp(1.5rem, 6vw, 2.5rem);
      box-shadow: 0 1.25rem 3.75rem rgba(0, 0, 0, 0.24);
    }
    .mark {
      display: flex;
      width: 2.75rem;
      height: 2.75rem;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      color: var(--accent);
    }
    h1 {
      margin: 1.5rem 0 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    button {
      min-height: 2.75rem;
      margin-top: 1.75rem;
      padding: 0.65rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.625rem;
      background: var(--accent);
      color: #071426;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible {
      outline: 3px solid rgba(109, 164, 255, 0.45);
      outline-offset: 3px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: currentColor;
    }
    .online { color: var(--success); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5a9.9 9.9 0 0 1 14 0"></path>
        <path d="M8.5 16a5 5 0 0 1 7 0"></path>
        <path d="M12 20h.01"></path>
        <path d="M3 3l18 18"></path>
      </svg>
    </div>
    <h1>You&apos;re offline</h1>
    <p>This page needs an internet connection. Reconnect and try again when you&apos;re ready.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <div class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Waiting for a connection</span>
    </div>
  </main>

  <script>
    const status = document.getElementById("status");

    function restore() {
      status.textContent = "Connection restored. Reloading…";
      status.parentElement.classList.add("online");
      window.setTimeout(() => window.location.reload(), 400);
    }

    if (navigator.onLine) restore();
    window.addEventListener("online", restore);
  </script>
</body>
</html>
